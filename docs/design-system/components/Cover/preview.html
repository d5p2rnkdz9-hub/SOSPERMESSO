<!-- @dsCard height=300 -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&amp;family=Atkinson+Hyperlegible:wght@400&amp;display=swap">
<style>
body{margin:0;background:var(--sp-paper)}
.cover{position:relative;width:960px;height:300px;overflow:hidden;background:var(--sp-paper)}
svg{position:absolute;left:480px;top:0}
.yellow{fill:var(--sp-yellow)}.ink{fill:var(--sp-ink)}.orange{fill:var(--cat-protection)}
.mint{fill:var(--cat-health)}.lilac{fill:var(--cat-family)}.blue{fill:var(--cat-work)}.white{fill:var(--sp-white)}
.edge{stroke:var(--sp-ink);stroke-width:3}
.text{position:absolute;left:40px;bottom:36px;max-width:440px}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:64px;line-height:.95;letter-spacing:-.02em;color:var(--sp-ink)}
p{margin:12px 0 0;font-family:var(--font-body);font-size:14px;color:var(--sp-muted)}
</style>
</head>
<body>
<div class="cover">
<!--
blocks: sp-yellow 320×300 slab (bleeds top/bottom), sp-ink sticker offsets 9px (sticker-lg), cat-protection disc r=72, cat-health pill 168×64, cat-family disc r=40, cat-work disc r=24
arrangement: one tall yellow slab with satellite discs and a pill, each with a solid ink offset like the logo's sticker outline
pattern: discs and pills from radius-pill — the system is soft, friendly and "sticker-like" (README: Forma, l'effetto adesivo)
scales: border-print 3px strokes, sticker-lg 9px offsets, radius-xl 28px on the slab, space-5/space-6 gaps
-->
<svg width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
<rect class="ink" x="129" y="-20" width="320" height="349" rx="28"></rect>
<rect class="yellow edge" x="120" y="-29" width="320" height="349" rx="28"></rect>
<circle class="ink" cx="129" cy="99" r="72"></circle>
<circle class="orange edge" cx="120" cy="90" r="72"></circle>
<rect class="ink" x="233" y="181" width="168" height="64" rx="32"></rect>
<rect class="mint edge" x="224" y="172" width="168" height="64" rx="32"></rect>
<circle class="ink" cx="349" cy="73" r="40"></circle>
<circle class="lilac edge" cx="340" cy="64" r="40"></circle>
<circle class="blue edge" cx="56" cy="236" r="24"></circle>
<circle class="white edge" cx="250" cy="110" r="14"></circle>
</svg>
<div class="text">
<h1>SOSpermesso<br>— Adesivo</h1>
<p>Chiaro come un cartello stradale, amichevole come un adesivo.</p>
</div>
</div>
</body>
</html>
