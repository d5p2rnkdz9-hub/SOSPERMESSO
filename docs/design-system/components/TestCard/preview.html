<!-- @dsCard group="Azioni" height=180 subtitle="I due ingressi ai test, su fondo giallo" -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&amp;display=swap">
<style>
body{margin:0;background:var(--sp-yellow);font-family:var(--font-display);color:var(--sp-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:28px;max-width:680px}
a{display:flex;flex-direction:column;gap:4px;padding:18px 22px;background:var(--sp-white);border:var(--border-ui) solid var(--sp-ink);border-radius:var(--radius-lg);box-shadow:var(--sticker-md);text-decoration:none;color:var(--sp-ink)}
a:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--sp-ink)}
.t{font-weight:800;font-size:21px;line-height:1.15}
.a{font-weight:700;font-size:16px}
</style>
</head>
<body>
<div class="grid">
<a href="#"><span class="t">Non ho ancora un permesso</span><span class="a">Aiutami a capire se posso averlo →</span></a>
<a href="#"><span class="t">Ho già un permesso</span><span class="a">Posso rinnovarlo o convertirlo? →</span></a>
</div>
</body>
</html>
