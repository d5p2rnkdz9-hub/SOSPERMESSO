<!-- @dsCard group="Contenuti" height=260 subtitle="Database: una scheda per categoria + segnaposto" -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&amp;display=swap">
<style>
body{margin:0;background:var(--sp-paper);color:var(--sp-ink);font-family:var(--font-display)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px;padding:24px}
.card{background:var(--sp-white);border:var(--border-ui) solid var(--sp-ink);border-radius:var(--radius-lg);box-shadow:var(--sticker-md);overflow:hidden;display:flex;flex-direction:column}
.cat{padding:9px 14px;border-bottom:var(--border-ui) solid var(--sp-ink);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex-grow:1}
.name{font-weight:800;font-size:19px;line-height:1.2}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.btns a{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:2px solid var(--sp-ink);border-radius:var(--radius-pill);background:var(--sp-white);color:var(--sp-ink);font-weight:700;font-size:13px;text-decoration:none}
.w .cat{background:var(--cat-work)}.w .btns a:first-child{background:var(--cat-work-tint)}
.p .cat{background:var(--cat-protection)}.p .btns a:first-child{background:var(--cat-protection-tint)}
.c .cat{background:var(--cat-health)}.c .btns a:first-child{background:var(--cat-health-tint)}
.ph{background:var(--sp-paper);border-style:dashed;box-shadow:none}
.ph .cat{background:var(--cat-family-tint);border-bottom-style:dashed}
.soon{align-self:flex-start;font-weight:700;font-size:12px;padding:3px 10px;border:2px dashed var(--sp-ink);border-radius:var(--radius-pill)}
</style>
</head>
<body>
<div class="grid">
<div class="card w"><div class="cat">Studio / Lavoro</div><div class="body"><span class="name">Lavoro subordinato</span><div class="btns"><a href="#">Cos’è</a><a href="#">Primo rilascio</a><a href="#">Rinnovo</a></div></div></div>
<div class="card p"><div class="cat">Protezione</div><div class="body"><span class="name">Protezione speciale</span><div class="btns"><a href="#">Cos’è</a><a href="#">Rinnovo</a></div></div></div>
<div class="card c"><div class="cat">Cure mediche</div><div class="body"><span class="name">Cure mediche</span><div class="btns"><a href="#">Cos’è</a><a href="#">Primo rilascio</a></div></div></div>
<div class="card ph"><div class="cat">Motivi familiari</div><div class="body"><span class="name">[Permesso in preparazione]</span><span class="soon">In costruzione</span></div></div>
</div>
</body>
</html>
