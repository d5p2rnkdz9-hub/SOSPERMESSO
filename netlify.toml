# Netlify build configuration for SOS Permesso (11ty)

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"

# Netlify Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── FAVICON & ICONS ──
# Browsers auto-request these at root
[[redirects]]
  from = "/favicon.ico"
  to = "/IMAGES/favicon-32x32.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/IMAGES/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/IMAGES/apple-touch-icon.png"
  status = 200

# ── SITEMAP ──
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# ── HOMEPAGE CANONICAL ──
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/index.html"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/fr/index.html"
  to = "/fr/"
  status = 301
  force = true

# ── OLD /src/pages/ URL STRUCTURE ──
# Before flat output, pages lived at /src/pages/*.html
[[redirects]]
  from = "/src/pages/permesso-*.html"
  to = "/permesso-:splat.html"
  status = 301

[[redirects]]
  from = "/src/pages/documenti-*.html"
  to = "/documenti-:splat.html"
  status = 301

[[redirects]]
  from = "/src/pages/*.html"
  to = "/:splat.html"
  status = 301

[[redirects]]
  from = "/en/src/pages/permesso-*.html"
  to = "/en/permesso-:splat.html"
  status = 301

[[redirects]]
  from = "/en/src/pages/documenti-*.html"
  to = "/en/documenti-:splat.html"
  status = 301

[[redirects]]
  from = "/en/src/pages/*.html"
  to = "/en/:splat.html"
  status = 301

# Also handle without .html extension
[[redirects]]
  from = "/src/pages/*"
  to = "/:splat.html"
  status = 301

[[redirects]]
  from = "/en/src/pages/*"
  to = "/en/:splat.html"
  status = 301

