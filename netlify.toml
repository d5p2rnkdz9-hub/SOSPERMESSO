# Netlify build configuration for SOS Permesso (11ty)

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"

# Netlify Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── FAVICON & ICONS ──
# Browsers auto-request these at root
[[redirects]]
  from = "/favicon.ico"
  to = "/IMAGES/favicon-32x32.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/IMAGES/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/IMAGES/apple-touch-icon.png"
  status = 200

# ── SITEMAP ──
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# ── HOMEPAGE CANONICAL ──
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/index.html"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/fr/index.html"
  to = "/fr/"
  status = 301
  force = true

# ── OLD /src/pages/ URL STRUCTURE ──
# Before flat output, pages lived at /src/pages/*.html. Netlify only supports a
# splat at the END of `from`, so "/src/pages/*.html" never matched and
# "/src/pages/*" -> "/:splat.html" produced ".html.html". Keep the splat as is:
# it already carries the extension (or none — pretty URLs resolve both).
[[redirects]]
  from = "/src/pages/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/en/src/pages/*"
  to = "/en/:splat"
  status = 301

