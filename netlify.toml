  to = "/permesso-protezione-speciale.html"
  status = 301

[[redirects]]
  from = "/documenti-protezione-speciale-dopo-decisione-positiva-della-commissione-o-del-tribunale-primo.html"
  to = "/documenti-protezione-speciale-primo.html"
  status = 301

[[redirects]]
  from = "/documenti-protezione-speciale-dopo-decisione-positiva-della-commissione-o-del-tribunale-rinnovo.html"
  to = "/documenti-protezione-speciale-rinnovo.html"
  status = 301

# ── OLD DOCUMENT PAGE SLUG REDIRECTS ──
# Old slugs used different naming (e.g. "a-seguito-di" vs "dopo", "art-27" suffixes)
# These are catch-alls for old doc URLs that don't match current filenames.
# Without force=true, Netlify serves existing files first, so new doc pages work fine.
[[redirects]]
  from = "/documenti-*-primo.html"
  to = "/database.html"
  status = 301

[[redirects]]
  from = "/documenti-*-rinnovo.html"
  to = "/database.html"
  status = 301

[[redirects]]
  from = "/en/documenti-*-primo.html"
  to = "/en/database.html"
  status = 301

[[redirects]]
  from = "/en/documenti-*-rinnovo.html"
  to = "/en/database.html"
  status = 301

[[redirects]]
  from = "/fr/documenti-*-primo.html"
  to = "/fr/database.html"
  status = 301

[[redirects]]
  from = "/fr/documenti-*-rinnovo.html"
  to = "/fr/database.html"
  status = 301

# ── SECURITY HEADERS ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── ASSET CACHING ──
# Long cache for images, fonts, CSS, JS — these are stable URLs.
# WhatsApp/Facebook/Twitter unfurl bots benefit from a clean CDN hit on og:image.
[[headers]]
  for = "/IMAGES/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

[[headers]]
  for = "/src/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/src/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
